benign:
  provider: deepseek   # "deepseek" | "openai_compat" | "mock" (no network, for loop tests)
  model: deepseek-flash   # available: deepseek-flash, deepseek-v4-pro ("deepseek-chat" is an alias of flash)
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY   # read from the environment or .env
  timeout_s: 60        # T (seconds): how long the attacker waits for ONE ATTEMPT's result -> else "NONE"
  timeout_by_runner:   # T per benchmark; runners not listed use timeout_s
    agentdojo: 300     # tool loop: several LLM calls per attempt
    agentdyn: 300
  temperature: 0
  max_tokens: 2048
  max_retries: 3       # 429 / 5xx / connection errors only, and only while T has time left

budget: 10             # B: max attempts per case (fixed at 10)
attacker: dummy        # TODO(attacker): baseline only; set to the key registered in attackers/__init__.py
attacker_args: {}      # constructor kwargs for the attacker (e.g. model, temperature)
adapters: auto         # "real" | "auto" (real where implemented, else mock) | "mock"

data:                  # test-case files only (user_cases / attacker_cases / reference_catalog are catalogs, not cases)
  - data/test_cases.jsonl
sample_per_runner: 3   # null = all cases
seed: 0
output_dir: outputs
